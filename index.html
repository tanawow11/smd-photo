<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMD — Upload your photo</title>
<link rel="icon" href="https://i.postimg.cc/bwx2TLW9/Happy-Bad-Dog.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f8f9fb;--card:#fff;--ink:#202124;--muted:#5f6368;--line:#e8eaed;
        --blue:#4285F4;--blue-s:#e3edfd;--blue-i:#1967d2;--red:#EA4335;--yel:#FBBC05;--green:#34A853;
        --green-s:#dcf1e2;--green-i:#137333;--red-s:#fce4e2;--red-i:#c5221f}
  @media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1f2226;--ink:#e8eaed;--muted:#9aa0a6;--line:#30343a;
        --blue-s:#1d2b44;--blue-i:#8ab4f8;--green-s:#1b3324;--green-i:#81c995;--red-s:#3b2120;--red-i:#f28b82}}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55}
  .wrap{max-width:460px;margin:0 auto;padding:20px 14px 40px}
  .gbar{height:6px;border-radius:6px;margin-bottom:18px;opacity:.6;
        background:linear-gradient(90deg,var(--blue) 0 25%,var(--red) 25% 50%,var(--yel) 50% 75%,var(--green) 75% 100%)}
  header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  header img{width:56px;height:56px;object-fit:contain}
  .title{font-size:1.3rem;font-weight:700;line-height:1.2}
  .t1{color:var(--blue)}.t2{color:var(--red)}.t3{color:#e0a800}.t4{color:var(--green)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;
        box-shadow:0 1px 3px rgba(60,64,67,.12),0 4px 12px rgba(60,64,67,.06)}
  h2{margin:0 0 6px;font-size:1.2rem}
  .muted{color:var(--muted)} .small{font-size:.88rem}
  .prev{width:180px;height:180px;margin:16px auto 8px;border-radius:16px;overflow:hidden;background:var(--line);
        display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--muted)}
  .prev img{width:100%;height:100%;object-fit:cover}
  .btn{font-family:inherit;font-size:1rem;border:1px solid var(--line);background:var(--card);color:var(--ink);
       border-radius:999px;padding:10px 18px;cursor:pointer;width:100%;min-height:50px;display:flex;align-items:center;justify-content:center;gap:6px}
  .btn.pri{background:var(--blue);color:#fff;border-color:transparent;font-weight:700}
  .btn + .btn{margin-top:8px}
  .msg{min-height:1.4em;margin:10px 0;font-size:.95rem}
  .ok{background:var(--green-s);color:var(--green-i);border-radius:12px;padding:10px}
  .bad{background:var(--red-s);color:var(--red-i);border-radius:12px;padding:10px}
  .tips{text-align:left;margin-top:16px;font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
  .hide{display:none!important}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
  .modal.on{display:flex}
  .modal .card{width:100%;max-width:440px}
  .cropBox{position:relative;width:min(340px,80vw);height:min(340px,80vw);margin:12px auto 10px;overflow:hidden;
